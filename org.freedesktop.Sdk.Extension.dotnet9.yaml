app-id: org.freedesktop.Sdk.Extension.dotnet9
branch: '25.08'
runtime: org.freedesktop.Sdk
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
build-extension: true
separate-locales: false
modules:
  - name: dotnet-sdk
    buildsystem: simple
    build-commands:
      - mkdir -p /usr/lib/sdk/dotnet9/{bin,lib}
      - cp -r * /usr/lib/sdk/dotnet9/lib
      - ln -s /usr/lib/sdk/dotnet9/lib/dotnet /usr/lib/sdk/dotnet9/bin/dotnet
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://dotnetcli.blob.core.windows.net/dotnet/Sdk/9.0.311/dotnet-sdk-9.0.311-linux-x64.tar.gz
        sha256: eb642d67ff82945de23b0ba3e1abfa2f216641c94ee8123488229db1309927c4
        x-checker-data:
          type: html
          url: https://dotnetcli.blob.core.windows.net/dotnet/Sdk/9.0/latest.version
          version-pattern: ^([\d\.a-z-]+)$
          url-template: https://dotnetcli.blob.core.windows.net/dotnet/Sdk/$version/dotnet-sdk-$version-linux-x64.tar.gz
      - type: archive
        only-arches: [aarch64]
        url: https://dotnetcli.blob.core.windows.net/dotnet/Sdk/9.0.311/dotnet-sdk-9.0.311-linux-arm64.tar.gz
        sha256: feca9910dc3ccea5801449242802de79e6179892db7338ce86eb9798c776c40d
