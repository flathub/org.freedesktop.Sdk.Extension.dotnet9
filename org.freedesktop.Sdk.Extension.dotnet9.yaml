app-id: org.freedesktop.Sdk.Extension.dotnet9
branch: '24.08'
runtime: org.freedesktop.Sdk
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
build-extension: true
separate-locales: false
modules:
  - name: dotnet-sdk
    buildsystem: simple
    build-commands:
      - mkdir -p /usr/lib/sdk/dotnet9/{bin,lib}
      - cp -r * /usr/lib/sdk/dotnet9/lib
      - ln -s /usr/lib/sdk/dotnet9/lib/dotnet /usr/lib/sdk/dotnet9/bin/dotnet
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://dotnetcli.blob.core.windows.net/dotnet/Sdk/9.0.317/dotnet-sdk-9.0.317-linux-x64.tar.gz
        sha256: 0bd1f4e2037c4a40dbe996217ef184ce17a43ede65b65cd0fc49c2ebad99ed04
        x-checker-data:
          type: html
          url: https://dotnetcli.blob.core.windows.net/dotnet/Sdk/9.0/latest.version
          version-pattern: ^([\d\.a-z-]+)$
          url-template: https://dotnetcli.blob.core.windows.net/dotnet/Sdk/$version/dotnet-sdk-$version-linux-x64.tar.gz
      - type: archive
        only-arches: [aarch64]
        url: https://dotnetcli.blob.core.windows.net/dotnet/Sdk/9.0.317/dotnet-sdk-9.0.317-linux-arm64.tar.gz
        sha256: da23617938ef254946b171db128a5b3cbbf6949c8dc15a13cbc2cfcae9d5e8f9
